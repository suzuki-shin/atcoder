name:                abc081
version:             0.1.0.0
github:              githubuser/abc081
license:             BSD3
author:              Author name here
maintainer:          example@example.com
copyright:           2025 Author name here

extra-source-files:
- README.md
- ChangeLog.md

description:         Please see the README on GitHub at <https://github.com/githubuser/abc081#readme>

dependencies:
- base >= 4.7 && < 5
- adjunctions
- array
- attoparsec
- bifunctors
- binary
- bitvec
- bytestring
- comonad
- containers
- contravariant
- deepseq
- directory
- distributive
- exceptions
- extra
- fgl
- filepath
- flow
- free
- ghc-bignum
- ghc-boot-th
- ghc-prim
- hashable
- heaps
- hmatrix
- hmatrix-gsl
- hmatrix-special
- indexed-traversable
- indexed-traversable-instances
- integer-gmp
- integer-logarithms
- kan-extensions
- lens
- linear-base
- list-t
- massiv
- megaparsec
- monad-memo
- mono-traversable
- mtl
- mutable-containers
- mwc-random
- parallel
- parsec
- parser-combinators
- pretty
- primitive
- process
- profunctors
- psqueues
- random
- reflection
- regex-tdfa
- safe-exceptions
- scientific
- semialign
- semigroupoids
- split
- stm
- strict
- strict-lens
- tagged
- template-haskell
- text
- tf-random
- these
- these-lens
- time
- transformers
- trifecta
- unboxing-vector
- unix
- unordered-containers
- utility-ht
- vector
- vector-algorithms
- vector-split
- vector-stream
- vector-th-unbox
- wide-word
- witherable
- xhtml

language: GHC2021

default-extensions:
- CPP
- ImportQualifiedPost
- LambdaCase
- LexicalNegation
- MultiWayIf
- NPlusKPatterns
- OverloadedStrings
- DataKinds
- PolyKinds
- NoStarIsType
- TypeFamilyDependencies
- UndecidableInstances

ghc-options:
- -Wall
- -Wno-unused-imports
- -Wno-x-partial

library:
    source-dirs: []

executables:
  b:
    main:               Main.hs
    source-dirs:        app/b
    ghc-options:
    - -rtsopts
    dependencies:
    - abc081

  a:
    main:               Main.hs
    source-dirs:        app/a
    ghc-options:
    - -rtsopts
    dependencies:
    - abc081

  b:
    main:               Main.hs
    source-dirs:        app/b
    ghc-options:
    - -rtsopts
    dependencies:
    - abc081

  a:
    main:               Main.hs
    source-dirs:        app/a
    ghc-options:
    - -rtsopts
    dependencies:
    - abc081

  add-entry:
    main:                Main.hs
    source-dirs:         app/zzz/add-entry
    dependencies:
    - abc081

  abc081:
    main:                Main.hs
    source-dirs:         app
    dependencies:
    - abc081
